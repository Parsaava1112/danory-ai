name: Danory GPT v8 tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tokenizers
      - name: Compile
        run: python -m compileall -q danory train.py generate.py scripts build_tokenizer.py
      - name: Verify parameter target
        run: python scripts/check_params.py
      - name: Forward/backward smoke test
        run: python scripts/smoke_test.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
